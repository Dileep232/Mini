apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-deployment
spec:
  replicas: 2
  selector:
   matchLabels:
    app: app2
    version: blue
  template:
   metadata:
    labels:
     app: app2
     version: blue
   spec:
    containers:
    - name: myapp
      image: dileep232/app2:latest
      ports:
      - containerPort: 8080
